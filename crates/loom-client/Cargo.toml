[package]
authors.workspace = true
description = "Locator-aware Loom client surface (LoomApi traits) for Uldren Loom."
edition.workspace = true
license.workspace = true
name = "uldren-loom-client"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "loom_client"

[lints]
workspace = true

[features]
default = ["local-client"]
local-client = ["loom-interchange-io"]
test-hooks = ["loom-store/test-hooks"]

[dependencies]
futures-core = { workspace = true }
getrandom = { workspace = true }
loom-codec = { workspace = true }
loom-compute = { workspace = true }
loom-core = { workspace = true, features = ["columnar-arrow"] }
loom-chat = { workspace = true }
loom-interchange = { workspace = true }
loom-interchange-io = { workspace = true, optional = true }
loom-inference = { workspace = true }
loom-lanes = { workspace = true }
loom-lifecycle = { workspace = true }
loom-drive.workspace = true
loom-pages = { workspace = true }
loom-reference = { workspace = true }
loom-remote-protocol = { workspace = true }
loom-result = { workspace = true }
loom-sql = { workspace = true }
loom-store = { workspace = true }
loom-substrate = { workspace = true, features = ["studio-lifecycle", "studio-surfaces"] }
loom-tickets = { workspace = true }
loom-types = { workspace = true }
loom-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
time = { workspace = true, features = ["std"] }
